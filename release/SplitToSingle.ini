; SplitToSingle.asi - DiRT Showdown: Split Screen -> Single Race
; 1 = on, 0 = off
[SplitToSingle]
Enabled=1
; skip the "Player 2 press START" overlay (P2 is never bound to a controller)
SkipP2PressStart=1
; after Player 1 picks a car/livery go straight to loading (no P2 car select)
SkipP2CarSelect=1
; build the race with only Player 1 as a human entrant (P2 car removed)
RemoveP2=1
; one full-screen viewport + normal single-player HUD during the race
SingleScreen=1
; the lobby "Player 2 options" button becomes a CAR CLASS picker (event default / race / demolition / hoonigan)
; the chosen class is used for both your car list and the AI
ClassSelect=1
; write every front-end flow transition to SplitToSingle.log (useful for troubleshooting)
LogFlow=0
